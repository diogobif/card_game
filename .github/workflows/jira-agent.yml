# New Jira ticket -> LangChain agent implements it -> checks -> pull request.
# Jira Automation fires a repository_dispatch (see scripts/jira-agent/README.md);
# it can also be started by hand from the Actions tab.
name: Jira agent

on:
  repository_dispatch:
    types: [jira-issue-created]
  workflow_dispatch:
    inputs:
      issue_key:
        description: Jira issue key (e.g. CG-12)
        required: true

# One run per ticket at a time.
concurrency:
  group: jira-agent-${{ github.event.client_payload.issue_key || inputs.issue_key }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ISSUE_KEY: ${{ github.event.client_payload.issue_key || inputs.issue_key }}
      BRANCH: agent/${{ github.event.client_payload.issue_key || inputs.issue_key }}
      RESULT_PATH: ${{ runner.temp }}/agent-result.json
    steps:
      - name: Validate issue key
        id: validate
        run: |
          if ! [[ "$ISSUE_KEY" =~ ^[A-Z][A-Z0-9_]+-[0-9]+$ ]]; then
            echo "Invalid issue key: '$ISSUE_KEY'" >&2
            exit 1
          fi

      - name: Skip if a branch already exists for this ticket
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${{ github.repository }}/branches/$BRANCH" --silent 2>/dev/null; then
            echo "Branch $BRANCH already exists; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.existing.outputs.skip != 'true'
        with:
          # Keep the token out of .git/config while the agent and checks run.
          persist-credentials: false

      - uses: actions/setup-node@v4
        if: steps.existing.outputs.skip != 'true'
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.existing.outputs.skip != 'true'
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Run agent
        id: agent
        if: steps.existing.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
        run: |
          node scripts/jira-agent/index.ts "$ISSUE_KEY" "$RESULT_PATH"
          echo "status=$(jq -r .status "$RESULT_PATH")" >> "$GITHUB_OUTPUT"

      # Re-run the gate independently of the agent, with no secrets in the env.
      - name: Verify changes (protected files, lint, build, tests)
        id: verify
        if: steps.agent.outputs.status == 'done'
        run: |
          node scripts/jira-agent/paths.ts
          if [ -z "$(git status --porcelain)" ]; then
            echo "changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changes=true" >> "$GITHUB_OUTPUT"
          node scripts/jira-agent/checks.ts

      - name: Open pull request
        id: pr
        if: steps.verify.outcome == 'success' && steps.verify.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="$ISSUE_KEY: $(jq -r .prTitle "$RESULT_PATH")"
          {
            echo "Jira: $(jq -r .issue.url "$RESULT_PATH")"
            echo
            jq -r .summary "$RESULT_PATH"
            echo
            echo "---"
            echo "Opened by the Jira agent ([run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})). Lint, build and tests passed in CI before this PR was opened."
          } > "$RUNNER_TEMP/pr-body.md"

          git config user.name "jira-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "$TITLE"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$BRANCH"
          URL=$(gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/pr-body.md")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Opened $URL"

      - name: Comment on the Jira ticket
        if: always() && steps.existing.outputs.skip != 'true' && steps.validate.outcome != 'failure'
        env:
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          PR_URL: ${{ steps.pr.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOME: >-
            ${{ steps.pr.outputs.url && 'pr'
              || steps.agent.outputs.status == 'blocked' && 'blocked'
              || steps.verify.outputs.changes == 'false' && 'no-changes'
              || steps.verify.outcome == 'failure' && 'checks-failed'
              || 'error' }}
        run: node scripts/jira-agent/notify.ts
